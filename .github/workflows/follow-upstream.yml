# Keeps this fork on upstream thaumiel's client patch without waiting for a logger update.
#
# Every 6 hours (or by hand: Actions tab -> "Follow upstream thaumiel" -> Run workflow) this
# checks https://git.xeondev.com/remielle/thaumiel for new commits. If there are any, it merges
# them into main, copies upstream's README to README.upstream.md, pushes, and runs
# release.yml, which publishes a player zip. When the new upstream is for a client version the
# logger does not support yet, that zip is labelled "logger off": src/logger_client.zig makes
# the logger start nothing on an unknown client, so the game runs exactly as under upstream.
#
# Upstream's client updates only touch README.md and assets/offsets.zon, which this fork never
# edits (README.md is kept by the "ours" merge driver, see .gitattributes). If a merge ever
# conflicts anyway, nothing is pushed and an issue is opened for a maintainer.
name: Follow upstream thaumiel

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: follow-upstream
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git remote add upstream https://git.xeondev.com/remielle/thaumiel.git
          git fetch --no-tags upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already up to date with upstream."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          subject=$(git log -1 --format=%s upstream/master)
          if ! git merge --no-ff --no-edit -m "Merge upstream thaumiel: $subject" upstream/master; then
            conflicts=$(git diff --name-only --diff-filter=U)
            git merge --abort
            title="Upstream thaumiel update needs a manual merge"
            if [ -z "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
              gh issue create --title "$title" --body "Upstream commit \`$(git rev-parse --short upstream/master)\` (\"$subject\") did not merge cleanly into main, so no release was made.

          Conflicting files:
          \`\`\`
          $conflicts
          \`\`\`

          To fix, on a local clone: \`git remote add upstream https://git.xeondev.com/remielle/thaumiel.git\` (once), \`git fetch upstream\`, \`git merge upstream/master\`, resolve, push to main. The release workflow runs on that push. See docs/MAINTAINING.md."
            fi
            exit 1
          fi

          git show upstream/master:README.md > README.upstream.md
          git add README.upstream.md
          git commit --amend --no-edit
          git push origin HEAD:main
          echo "merged=true" >> "$GITHUB_OUTPUT"

  release:
    needs: merge
    if: needs.merge.outputs.merged == 'true'
    uses: ./.github/workflows/release.yml
    with:
      ref: main
